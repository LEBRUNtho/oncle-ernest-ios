[scummvm]
confirm_exit=false
# le moteur Director est marqué « instable » par ScummVM : pas d avertissement au lancement
enable_unsupported_game_warning=false
# tactile direct : toucher = cliquer ; glisser le doigt = survol (noms des pages, objets) ; doigt posé sur un objet puis glisser = le déplacer
touch_mode_menus=direct
touch_mode_2d_games=direct
# image agrandie lissée
filtering=true
# boutons ScummVM à l'écran masqués : le jeu a son propre menu (serpent)
onscreen_control=false
# tolérance de clic (pixels du jeu) : un appui à côté d'une petite cible est rattrapé
album_touch_snap=20
album_hide_cursor=true
orientation_menus=landscape
orientation_games=landscape
# jeu 4 : polices Mac classiques (accents) et couleurs vraies
true_color=true
