[scummvm]
confirm_exit=false
# Sonde Album : tactile direct (toucher = cliquer ; doigt posé sur un objet puis glisser = le déplacer ; glisser depuis le fond de page ou avec un outil = survol)
touch_mode_menus=direct
touch_mode_2d_games=direct
# image agrandie lissée (agrandissement non entier ~2,75x sur iPhone)
filtering=true
# boutons ScummVM à l'écran (souris / menu) masqués : le jeu a son propre menu quitter/sauvegarder
onscreen_control=false
# tolérance de clic : un appui à côté d'une petite cible (post-it, outil) est rattrapé (pixels du jeu)
album_touch_snap=28
# pas de curseur : le doigt montre où l'on agit ; doigt posé sur un objet = objet saisi (glisser sans attendre)
album_hide_cursor=true
orientation_menus=landscape
orientation_games=landscape
